<main class="flex justify-center text-white">
  <div class="flex justify-between w-full max-w-[1600px]">
    <div class="relative w-[568px]">
      <img
        src="/assets/images/bg_profile.svg"
        class="w-[568px] absolute top-0 left-0"
        alt="profile-pic-shadow"
      />
      <img
        src="/assets/images/profile-img.webp"
        class="w-[568px] absolute top-0 left-0 border-4 border-primary rounded-3xl"
        alt="profile-pic"
      />
    </div>
    <div class="flex flex-col gap-5 pt-28">
      <span class="text-primary text-2xl w-[568px]">Who I am</span>
      <div
        class="flex flex-col gap-4 bg-[#3DCFB61A] border border-[#3DCFB6] rounded-4xl p-8 w-[568px] text-lg"
      >
        <h2 class="text-primary font-fira font-bold text-6xl">About me</h2>
        <p>
          Hi, my name is Martin Unger, a Fullstack Developer based in Vienna. I
          have solid experience building scalable applications with Angular,
          Django, and .NET.
        </p>
        @for (point of aboutPoints; track $index) {
          <div class="flex gap-4">
            <img [src]="point.icon" [alt]="point.alt" class="w-8 h-8" />
            <p>{{ point.text }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</main>
