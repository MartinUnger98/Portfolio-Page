<main
  class="flex justify-between items-center w-full text-white px-4 sm:px-6 md:px-12 lg:px-24 py-4 md:py-6 lg:py-8 transition-colors duration-300"
  [ngClass]="{ 'bg-[#1c1c1c]/80 backdrop-blur-sm': isScrolledPastHero }"
>
  <div class="flex items-center gap-4 md:gap-6">
    <app-toggle-button
      [value]="i18n.lang()"
      (valueChange)="onLangChange($event)"
    ></app-toggle-button>

    <nav class="hidden lg:flex gap-6 font-fira text-xl">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          (click)="scrollToSection($event, link.href)"
          class="group relative flex flex-col items-center justify-center"
        >
          <span>{{ i18n.translate(link.label) }}</span>
          <span
            aria-hidden="true"
            class="pointer-events-none absolute top-full left-1/2 -translate-x-1/2 text-[32px] text-primary opacity-0 group-hover:opacity-100 transition-opacity duration-300"
          >
            •
          </span>
        </a>
      }
    </nav>
  </div>

  <img
    class="h-12 md:h-16 lg:h-20 cursor-pointer"
    src="/assets/images/logo.svg"
    alt=""
    (click)="scrollToTop()"
  />

  <button
    type="button"
    class="lg:hidden text-white text-2xl cursor-pointer"
    (click)="toggleMobileMenu()"
    [attr.aria-expanded]="isMobileMenuOpen"
    [attr.aria-label]="i18n.translate('Toggle navigation menu')"
  >
    <i class="fa-solid" [class.fa-bars]="!isMobileMenuOpen" [class.fa-xmark]="isMobileMenuOpen"></i>
  </button>
</main>

@if (isMobileMenuOpen) {
  <nav
    class="lg:hidden absolute top-full left-0 w-full bg-[#1c1c1c]/95 backdrop-blur-sm border-t border-white/10 flex flex-col items-center gap-6 py-8 font-fira text-xl text-white"
  >
    @for (link of navLinks; track link.href) {
      <a [href]="link.href" (click)="scrollToSection($event, link.href)" class="hover:text-primary transition-colors duration-300">
        {{ i18n.translate(link.label) }}
      </a>
    }
  </nav>
}
