<main id="projects" class="text-white w-full flex justify-center">
  <div class="max-w-[1600px] w-full flex flex-col gap-5">
    <span class="text-primary text-2xl">Portfolio</span>
    <div
      class="flex flex-col gap-4 bg-[#3DCFB61A] border border-[#3DCFB6] rounded-4xl p-8 text-lg"
    >
      <h2 class="text-primary font-fira font-bold text-6xl">
        Featured Projects
      </h2>
      <p>
        Explore a selection of my work here - Interact with projects to see my
        skills in action.
      </p>

      <div class="flex flex-col mt-2">
        <div class="border-t border-primary"></div>
        @for (project of projects; track $index; let i = $index) {
          <button
            type="button"
            (click)="openProject(i)"
            class="group flex items-center justify-between gap-8 py-6 border-b border-white/20 text-left cursor-pointer"
          >
            <span
              class="font-fira font-bold text-2xl group-hover:text-primary transition-colors duration-300"
            >
              {{ project.name }}
            </span>
            <span class="flex items-center gap-2 text-base text-white/70">
              @for (tech of project.techs; track $index; let last = $last) {
                <span>{{ tech.name }}</span>
                @if (!last) {
                  <span class="text-primary">|</span>
                }
              }
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</main>
