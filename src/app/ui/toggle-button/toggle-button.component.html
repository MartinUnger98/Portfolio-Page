<button
  type="button"
  class="lang-toggle"
  [class.is-de]="value === 'de'"
  [attr.aria-label]="labels[value]"
  [attr.lang]="value"
  (click)="toggle()"
>
  <span class="thumb" aria-hidden="true"></span>

  <span class="labels" aria-hidden="true">
    <span class="label en">EN</span>
    <span class="label de">DE</span>
  </span>
</button>
