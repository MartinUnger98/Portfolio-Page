@if (href) {
  <a
    [href]="href"
    [attr.target]="target"
    [attr.rel]="target === '_blank' ? 'noopener noreferrer' : null"
    [attr.aria-label]="ariaLabel"
    (click)="handleClick($event)"
    class="inline-flex h-12 items-center cursor-pointer text-lg hover:text-primary transition-[color,transform] duration-300 ease-in-out hover:scale-105 active:scale-95"
    [class]="
      outlined ? 'border-white border hover:border-primary rounded-full' : ''
    "
  >
    <span class="px-6 flex items-center gap-2">
      {{ text }}
      @if (icon) {
        <i [class]="icon" aria-hidden="true"></i>
      }
      @if (target === "_blank") {
        <span class="sr-only">({{ newTabHint }})</span>
      }
    </span>
  </a>
} @else {
  <button
    [attr.type]="type"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel"
    (click)="handleClick($event)"
    class="h-12 cursor-pointer text-lg hover:text-primary transition-[color,transform] duration-300 ease-in-out hover:scale-105 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100"
    [class]="
      outlined ? 'border-white border hover:border-primary rounded-full' : ''
    "
  >
    <span class="px-6 flex items-center gap-2">
      {{ text }}
      @if (icon) {
        <i [class]="icon" aria-hidden="true"></i>
      }
    </span>
  </button>
}
